<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Varshini & Chandan — Wedding Reception Invitation</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <script src="./editable/wedding-data.js"></script>
    <script type="module" crossorigin src="./assets/index-2d1L6cXj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-DJO19CfA.css">
    <style>
      .music-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(251, 249, 244, 0.88);
        border: 1.5px solid rgba(184, 134, 11, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 18px rgba(52, 44, 35, 0.15), 0 0 12px rgba(203, 161, 83, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        outline: none;
        padding: 0;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        border-color: rgba(184, 134, 11, 0.95);
        box-shadow: 0 6px 22px rgba(52, 44, 35, 0.22), 0 0 16px rgba(203, 161, 83, 0.4);
      }
      .music-toggle-btn:active {
        transform: scale(0.92);
      }
      .music-bars {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        height: 18px;
        padding-bottom: 2px;
      }
      .music-bars .bar {
        width: 2.5px;
        background: #b8860b;
        border-radius: 2px;
        height: 4px;
        transition: height 0.25s ease, opacity 0.25s ease;
      }
      .music-toggle-btn.playing .bar-1 {
        animation: audioWave1 1.1s ease-in-out infinite alternate;
      }
      .music-toggle-btn.playing .bar-2 {
        animation: audioWave2 0.85s ease-in-out infinite alternate;
      }
      .music-toggle-btn.playing .bar-3 {
        animation: audioWave3 1.25s ease-in-out infinite alternate;
      }
      .music-toggle-btn.playing .bar-4 {
        animation: audioWave4 0.95s ease-in-out infinite alternate;
      }
      @keyframes audioWave1 { 0% { height: 4px; } 100% { height: 16px; } }
      @keyframes audioWave2 { 0% { height: 16px; } 100% { height: 6px; } }
      @keyframes audioWave3 { 0% { height: 6px; } 100% { height: 18px; } }
      @keyframes audioWave4 { 0% { height: 14px; } 100% { height: 5px; } }
      .music-toggle-btn.paused .bar {
        opacity: 0.4;
        height: 4px;
      }

      /* Photo Gallery & Lightbox */
      .gallery-masonry {
        columns: 2 160px;
        column-gap: 12px;
        max-width: 780px;
        margin: 28px auto 0;
        padding: 0 4px;
      }
      @media (min-width: 640px) {
        .gallery-masonry {
          columns: 3 220px;
          column-gap: 16px;
        }
      }
      .gallery-item {
        break-inside: avoid;
        margin-bottom: 12px;
        position: relative;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid rgba(184, 134, 11, 0.35);
        box-shadow: 0 10px 24px -10px rgba(60, 45, 25, 0.35);
        transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        background: #fbf9f4;
      }
      @media (min-width: 640px) {
        .gallery-item {
          margin-bottom: 16px;
        }
      }
      .gallery-item:hover {
        transform: translateY(-3px) scale(1.02);
        border-color: rgba(184, 134, 11, 0.85);
        box-shadow: 0 16px 36px -12px rgba(60, 45, 25, 0.55);
      }
      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.6s ease;
      }
      .gallery-item:hover img {
        transform: scale(1.05);
      }
      .gallery-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(35, 28, 20, 0.7) 0%, transparent 60%);
        opacity: 0;
        transition: opacity 0.3s ease;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 12px;
      }
      .gallery-item:hover .gallery-overlay {
        opacity: 1;
      }
      .gallery-badge {
        font-family: 'Josefin Sans', sans-serif;
        text-transform: uppercase;
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        color: #fbf9f4;
        background: rgba(35, 28, 20, 0.8);
        border: 1px solid rgba(203, 161, 83, 0.6);
        padding: 4px 12px;
        border-radius: 9999px;
        backdrop-filter: blur(4px);
      }
      .gallery-lightbox {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(18, 14, 10, 0.93);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: galleryFadeIn 0.25s ease-out;
      }
      .gallery-lightbox-content {
        position: relative;
        max-width: 90vw;
        max-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gallery-lightbox-img {
        max-width: 100%;
        max-height: 82vh;
        object-fit: contain;
        border-radius: 4px;
        border: 1.5px solid rgba(203, 161, 83, 0.65);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      }
      .gallery-lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(251, 249, 244, 0.15);
        border: 1px solid rgba(203, 161, 83, 0.5);
        color: #fbf9f4;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        z-index: 20;
      }
      .gallery-lightbox-close:hover {
        background: rgba(251, 249, 244, 0.3);
        transform: scale(1.08);
      }
      .gallery-lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(251, 249, 244, 0.18);
        border: 1px solid rgba(203, 161, 83, 0.5);
        color: #fbf9f4;
        font-size: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        z-index: 20;
      }
      .gallery-lightbox-nav:hover {
        background: rgba(251, 249, 244, 0.35);
        transform: translateY(-50%) scale(1.08);
      }
      .gallery-lightbox-prev {
        left: 20px;
      }
      .gallery-lightbox-next {
        right: 20px;
      }
      .gallery-lightbox-counter {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Josefin Sans', sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        color: #fbf9f4;
        background: rgba(35, 28, 20, 0.75);
        border: 1px solid rgba(203, 161, 83, 0.5);
        padding: 4px 14px;
        border-radius: 9999px;
        backdrop-filter: blur(4px);
      }
      @keyframes galleryFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Happy Healthy hospital highlight badge */
      .hospital-highlight-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-bottom: 0.85rem;
      }
      .hospital-highlight-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-caps, "Josefin Sans", -apple-system, sans-serif);
        font-weight: 800;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        color: #2b1d12;
        background: linear-gradient(135deg, rgba(254, 240, 138, 0.6) 0%, rgba(245, 197, 66, 0.45) 50%, rgba(212, 160, 23, 0.38) 100%);
        border: 1.5px solid rgba(184, 134, 11, 0.75);
        border-radius: 9999px;
        padding: 5px 18px;
        box-shadow: 0 3px 14px rgba(184, 134, 11, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-shadow: 0 0 1px rgba(255, 255, 255, 0.4);
      }
      @media (min-width: 640px) {
        .hospital-highlight-badge {
          font-size: 0.95rem;
          letter-spacing: 0.14em;
          padding: 6px 22px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Audio -->
    <audio id="bg-music" loop preload="auto">
      <source src="./editable/assets/bg-music.mp3" type="audio/mpeg" />
    </audio>

    <!-- Floating Audio Control -->
    <button id="music-toggle" class="music-toggle-btn paused" aria-label="Toggle background music" title="Toggle Music">
      <div class="music-bars">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
      </div>
    </button>

    <div id="root"></div>

    <script>
      (function () {
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('music-toggle');
        let isPlaying = false;

        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.src) {
          audio.src = window.WEDDING_DATA.music.src;
        }

        function playMusic() {
          if (!audio) return;
          audio.volume = 0.85;
          const p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              isPlaying = true;
              btn.classList.add('playing');
              btn.classList.remove('paused');
            }).catch(function (e) {
              console.log('Autoplay deferred until interaction:', e);
            });
          }
        }

        function pauseMusic() {
          if (!audio) return;
          audio.pause();
          isPlaying = false;
          btn.classList.remove('playing');
          btn.classList.add('paused');
        }

        window.__playMusic = playMusic;
        window.__pauseMusic = pauseMusic;

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (isPlaying) {
            pauseMusic();
          } else {
            playMusic();
          }
        });

        function onFirstInteraction() {
          if (!isPlaying) {
            playMusic();
          }
          document.removeEventListener('click', onFirstInteraction);
          document.removeEventListener('touchstart', onFirstInteraction);
        }
        document.addEventListener('click', onFirstInteraction, { once: true });
        document.addEventListener('touchstart', onFirstInteraction, { once: true });
      })();
    </script>
  </body>
</html>
